<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="" />
  <title>전찬주 포트폴리오 시안</title>
  <meta name="claude:viewport-fit-sides" content="cover" />
  <link rel="stylesheet" href="../src/fonts/pretendard.css" />
  <style>
    /* 컨셉 목록: 한 줄 헤더 + 카드 3장 그리드 */
    :root { --bg: #f5f3ee; --fg: #16181c; --muted: #6b6f78; --line: #d9d5cc; --card: #fffdf8; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0d1014; --fg: #ecebe6; --muted: #8d939c; --line: #262b33; --card: #14181e; color-scheme: dark; } }
    :root[data-theme="dark"] { --bg: #0d1014; --fg: #ecebe6; --muted: #8d939c; --line: #262b33; --card: #14181e; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 "Pretendard Variable", "Pretendard", -apple-system, system-ui, sans-serif; }
    main { max-width: 960px; margin: 0 auto; padding-block: 56px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
    h1 { font-size: clamp(28px, 5vw, 44px); margin: 0; letter-spacing: -0.02em; }
    p.lead { color: var(--muted); margin: 8px 0 40px; }
    button { font: inherit; color: inherit; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    a.card { display: block; height: 100%; padding: 24px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: inherit; text-decoration: none; transition: transform .2s, border-color .2s; }
    a.card:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
    a.card:hover, a.card:focus-visible { transform: translateY(-3px); border-color: var(--fg); }
    .num { font: 13px ui-monospace, monospace; color: var(--muted); }
    h2 { margin: 6px 0 8px; font-size: 22px; }
    .card p { margin: 0; color: var(--muted); font-size: 15px; }
  </style>
</head>
<body>
  <main>
    <header><h1 id="title"></h1><button id="lang" type="button"></button></header>
    <p class="lead" id="lead"></p>
    <ul id="list"></ul>
  </main>
  <script type="module">
    import { bindLangToggle, onLangChange } from '../src/i18n.ts'
    const copy = {
      ko: { title: '포트폴리오 컨셉 3종', lead: '같은 콘텐츠를 세 가지 모션 컨셉으로 만들었어요. 비교해 보고 하나를 고르거나 섞어 주세요.',
        items: [['Deep Dive', '어항 속으로 잠수하기 — 수심이 곧 시간축'], ['Commit Museum', '11년의 커밋을 소장품으로 전시하기'], ['Living Terminal', '살아 있는 ASCII 문자 그리드']] },
      en: { title: 'Three portfolio concepts', lead: 'The same content, built as three motion concepts. Compare them, then pick one or mix.',
        items: [['Deep Dive', 'Dive into the aquarium — depth is the timeline'], ['Commit Museum', 'A decade of commits, exhibited'], ['Living Terminal', 'A living grid of ASCII characters']] },
    }
    const hrefs = ['deep-dive/index.html', 'museum/index.html', '../index.html']
    bindLangToggle(document.getElementById('lang'))
    onLangChange((c) => {
      const t = copy[c.lang]
      document.title = t.title
      document.getElementById('title').textContent = t.title
      document.getElementById('lead').textContent = t.lead
      document.getElementById('list').innerHTML = t.items.map(([name, desc], i) =>
        `<li><a class="card" href="${hrefs[i]}"><span class="num">0${i + 1}</span><h2>${name}</h2><p>${desc}</p></a></li>`).join('')
    })
  </script>
</body>
</html>
