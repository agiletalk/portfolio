<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <link rel="canonical" href="https://agiletalk.github.io/portfolio/" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://agiletalk.github.io/portfolio/" />
  <meta property="og:title" content="전찬주 — iOS Engineer · Agentic AI Developer" />
  <meta property="og:description" content="15년째 iOS 앱을 만들고, 지금은 AI 에이전트로 개발 방식을 다시 설계합니다." />
  <meta property="og:image" content="https://agiletalk.github.io/portfolio/og.png" />
  <meta property="og:image:width" content="1200" />

  <title>전찬주 — iOS Engineer · Agentic AI Developer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%230d1117%22/%3E%3Ctext x=%222%22 y=%2212%22 font-size=%229%22 font-family=%22monospace%22 fill=%22%237ee0b5%22%3E%3E_%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" />
  <link rel="stylesheet" href="./src/fonts/pretendard.css" />
  <link rel="stylesheet" href="./terminal/style.css" />
</head>
<body>
  <a class="skip" href="#about">↓ <span data-t="nav.about"></span></a>

  <header class="topbar" role="banner">
    <a class="topbar-home" id="back-top" href="./">~/chanju</a>
    <nav class="topbar-nav" aria-label="sections">
      <a href="#about" data-t="nav.about"></a>
      <a href="#career" data-t="nav.career"></a>
      <a href="#projects" data-t="nav.projects"></a>
      <a href="#contact" data-t="nav.contact"></a>
    </nav>
    <button type="button" class="topbar-lang" data-lang-toggle></button>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-name">
      <div class="win">
        <div class="win-title" aria-hidden="true">
          <span class="dots"><i></i><i></i><i></i></span>
          <span class="win-path">chanju@korea: ~/aquarium</span>
          <span class="win-size" id="win-size"></span>
        </div>
        <div class="whoami">
          <p class="line"><span class="ps1">~ $</span> <span class="tw" id="cmd-whoami"></span></p>
          <h1 id="hero-name" class="name tw" data-tw="name"></h1>
          <p class="role tw" id="hero-role"></p>
          <p class="intro tw" id="hero-intro"></p>
          <p class="line note" id="rm-note" hidden></p>
        </div>
        <div class="tank" id="tank">
          <canvas id="aquarium" aria-hidden="true"></canvas>
        </div>
        <p class="hint" aria-hidden="true"><span class="hint-arrow">▼</span> <span data-t="scrollHint"></span></p>
      </div>
    </section>

    <section id="about" class="sec" aria-labelledby="h-about">
      <h2 id="h-about" class="cmd"><span class="ps1" aria-hidden="true">~ $</span> <span class="cmd-text">cat about.md</span> <span class="cmt" data-t="nav.about"></span></h2>
      <div class="out" id="out-about"></div>
    </section>

    <section id="career" class="sec" aria-labelledby="h-career">
      <h2 id="h-career" class="cmd"><span class="ps1" aria-hidden="true">~ $</span> <span class="cmd-text">git log --career --graph</span> <span class="cmt" data-t="nav.career"></span></h2>
      <div class="out" id="out-career"></div>
    </section>

    <section id="commits" class="sec" aria-labelledby="h-commits">
      <h2 id="h-commits" class="cmd"><span class="ps1" aria-hidden="true">~ $</span> <span class="cmd-text">git shortlog --by-year</span> <span class="cmt" data-t="commitsLabel"></span></h2>
      <div class="out" id="out-commits"></div>
    </section>

    <section id="projects" class="sec" aria-labelledby="h-projects">
      <h2 id="h-projects" class="cmd"><span class="ps1" aria-hidden="true">~ $</span> <span class="cmd-text">ls -l projects/</span> <span class="cmt" data-t="nav.projects"></span></h2>
      <div class="out" id="out-projects"></div>
    </section>

    <section id="skills" class="sec" aria-labelledby="h-skills">
      <h2 id="h-skills" class="cmd"><span class="ps1" aria-hidden="true">~ $</span> <span class="cmd-text">cat skills.json</span></h2>
      <div class="out" id="out-skills"></div>
    </section>

    <section id="contact" class="sec" aria-labelledby="h-contact">
      <h2 id="h-contact" class="cmd"><span class="ps1" aria-hidden="true">~ $</span> <span class="cmd-text">contact</span> <span class="cmt" data-t="nav.contact"></span></h2>
      <div class="out" id="out-contact"></div>
    </section>

    <footer class="sec foot">
      <p class="line"><span class="ps1" aria-hidden="true">~ $</span> <a href="https://agiletalk.github.io" class="back-link"><span class="cmd-text">cd ../blog</span> <span class="cmt"># agiletalk.github.io</span></a></p>
      <p class="line"><span class="ps1" aria-hidden="true">~ $</span> <span class="cursor" aria-hidden="true"></span></p>
    </footer>
  </main>

  <script type="module" src="./terminal/main.ts"></script>
</body>
</html>
